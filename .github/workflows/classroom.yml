name: quantLab Numerical Methods Exercise Workflow (GitHub Classroom)

on:
  push:
  pull_request:

jobs:
  build:
    name: 🛠️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (no tests, no checkstyle)
        run: mvn -B -Dmaven.test.skip=true -DskipTests=true -Dcheckstyle.skip=true clean compile

  javadoc:
    name: 📚 JavaDoc
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate JavaDoc (no tests, no checkstyle)
        run: mvn -B -Dmaven.test.skip=true -DskipTests=true -Dcheckstyle.skip=true -Dadditionalparam='-Xdoclint:none' javadoc:javadoc

  checkstyle:
    name: 🔍 Checkstyle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Restore Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run Checkstyle
        run: mvn -B -Dcheckstyle.skip=false checkstyle:check

  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Testing your Application (Autograding)
        uses: education/autograding@v1

    on: [push]

    jobs:
      build:
        name: Autograding
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
          - name: Set up Java
            uses: actions/setup-java@v3
            with:
              distribution: 'zulu'
              java-version: '17'
          - name: Build with Maven
            run: mvn -B package --file pom.xml -DskipTests=true
          - name: Testing your Application (Autograding)
            uses: education/autograding@v1
            